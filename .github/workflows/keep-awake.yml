# Keeps every Streamlit Community Cloud app listed in
# .github/streamlit-apps.txt awake, and proves the live app is current.
#
# Why a browser and not a ping: the app URL answers 200 from a static shell
# whether the app is running or asleep, so an HTTP uptime check reports green
# on a sleeping app. Only a real browser session opens the websocket that
# Community Cloud counts as a visit, so this drives headless Chromium.
#
# What Community Cloud actually does with a push, measured on 16 September
# 2026 across a day of pushes: it applies it on its own, between four minutes
# and about two hours later, with the app already awake throughout. Nothing
# pushed from here makes that faster. Its documentation says a dependency
# file change forces a full redeploy, so that was tried, twice, as an
# automatic nudge: neither change was applied within forty minutes, and the
# nudge left bot commits on the branch for nothing. The only lever that is
# not a push is the Reboot button on share.streamlit.io, and it has no API.
#
# So this workflow is honest about that. Two jobs, because two questions.
#
#   wake            Is the app awake and serving. Runs on the schedule, on
#                   every push and by hand. Fails if the app is down, or if
#                   every registered tool is missing (a broken build), or,
#                   on the schedule only, if a change to the deploy branch
#                   has sat positively unapplied for longer than Community
#                   Cloud has ever taken on its own. That last one repeats
#                   every scheduled run until someone presses Reboot, which
#                   is the point: it needs a person. Inside the grace a stale
#                   deploy is a warning annotation and a line in the job
#                   summary, never a failure, because one job used to fail
#                   every three hours for a condition that was already
#                   known, was not a sleeping app, and had not changed since
#                   the last email. That is how the next real outage gets
#                   deleted unread. Anything the prober could not read, a
#                   page that timed out or painted nothing, a pass that ran
#                   out of time, a build label on no known commit, is
#                   UNPROVEN and never escalates.
#
#   deploy-current  Did the change that just reached the deploy branch go
#                   live. Runs once per change, by push or by the dispatch
#                   promote-to-deploy.yml makes, never on the schedule. Waits
#                   twenty minutes, looking again each minute at only what is
#                   not yet confirmed, and reports. The only failure it can
#                   send is an app that is down: a change still unapplied
#                   after twenty minutes is normal here and is a warning, and
#                   the schedule carries that warning until it is applied or
#                   the grace runs out.
name: Keep Streamlit apps awake

on:
  # Community Cloud sleeps an app after a spell with no visitor, and that
  # window has been shortened over time. Every three hours leaves a wide
  # margin even if a scheduled run is delayed.
  schedule:
    # Minute 23, not minute 0. GitHub's own documentation says the schedule
    # event is delayed when Actions is under high load, that the start of every
    # hour is exactly when that load peaks, and that queued jobs may simply be
    # dropped then. A wake that is dropped is an app that goes to sleep, so the
    # run is deliberately placed away from the busiest minute.
    - cron: "23 */3 * * *"
  # Any push wakes the app, which is what makes a newly merged tool show up
  # without anyone rebooting it by hand.
  push:
    branches: ["**"]
  workflow_dispatch:

# Two queues, not one. A single group held every event, with room for one
# pending run, so a deploy branch push queued behind a long deploy check was
# cancelled by the next schedule tick or the next push to any session branch,
# and its verdict was never given. Deploy branch runs now queue only behind
# each other, where being superseded by a newer push is harmless because the
# newer push carries the older one's tools. Everything else, the schedule and
# pushes to other branches, queues separately and never touches that queue.
concurrency:
  group: keep-streamlit-awake-${{ (github.event_name != 'schedule' && github.ref_name == 'claude/kind-feynman-489x72') && 'deploy' || 'wake' }}
  cancel-in-progress: false

# Read only. Nothing here writes to the repository any more.
permissions:
  contents: read

env:
  # The branch Streamlit Community Cloud serves from, recorded in README.md.
  # Only used to decide which tool list the live app is measured against.
  DEPLOY_BRANCH: claude/kind-feynman-489x72
  # Community Cloud applied every push today within about two hours on its
  # own. Past three hours a change that is still unapplied is a deploy that
  # is stuck, and stuck is the one deploy condition worth an email, because
  # the fix is a person pressing Reboot on share.streamlit.io. The grace is
  # measured from the commit time of the deploy branch head, which in this
  # repository is within a minute of the push, and it counts only positive
  # staleness: a tool that fell back to the landing page or a build label
  # on an older commit of this branch. A page that merely could not be read
  # never escalates. Only the schedule applies the grace: a push run is
  # inside it by definition, and an old commit pushed back on purpose would
  # otherwise fail its own push run at once.
  STALE_GRACE_SECONDS: "10800"
  # Wall clock seconds one pass over the tool list may take. A healthy pass
  # over 33 tools is under four minutes. A pass in which every page times out
  # would run over an hour, and the job dying of its own timeout is a failure
  # email about an app that is up. Past this the rest of the list is left
  # UNPROVEN. The job timeouts below are sized to this plus one worst case
  # read, and tests/test_keep_streamlit_awake.py checks that arithmetic.
  PASS_BUDGET_SECONDS: "600"

jobs:
  wake:
    runs-on: ubuntu-latest
    # Install, the wake itself, then one pass bounded by PASS_BUDGET_SECONDS
    # plus one worst case read. Sized by the test, not by feel.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Take the tool list from the branch that is actually deployed
        id: registry
        run: |
          # The live app is built from DEPLOY_BRANCH, so that branch's registry
          # is the correct list to measure it against. A scheduled run happens
          # on the default branch, which can be ahead or behind, and comparing
          # against the wrong list would either miss a stale deploy or invent
          # a failure that is not real.
          #
          # Two hundred commits deep, so the run also knows which commits are
          # behind the head. The live app's build label is counted as an old
          # checkout only when it is one of those; a label on no known commit
          # proves nothing and is never escalated.
          #
          # If the fetch fails this run only wakes the app and checks the
          # tools of this checkout as warnings. It says nothing about the
          # deploy's build or age, because a session branch head is the wrong
          # commit to measure the live app against and its commit time is the
          # wrong age.
          if git fetch --depth=200 origin "$DEPLOY_BRANCH" 2>/dev/null; then
            git show FETCH_HEAD:tools/registry.py > deployed-registry.py
            git log --format=%H FETCH_HEAD > known-builds.txt
            echo "path=deployed-registry.py" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            echo "committed_at=$(git log -1 --format=%ct FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            echo "Measuring the live app against $DEPLOY_BRANCH at $(git rev-parse --short FETCH_HEAD), with $(wc -l < known-builds.txt) commits of its history known."
          else
            echo "path=tools/registry.py" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "committed_at=" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not read $DEPLOY_BRANCH, so this run only wakes the app and checks the tools of this checkout as warnings. It says nothing about the deploy's build or age."
          fi

      - name: Wake every app and prove it rendered
        # The grace goes only with the schedule. A push run is inside any
        # sensible grace by definition, and the commit time of a pushed head
        # is hours old when an old commit is pushed back on purpose, which
        # would otherwise fail that push's own run at once.
        run: |
          set -euo pipefail
          args=(--apps .github/streamlit-apps.txt
                --registry "${{ steps.registry.outputs.path }}"
                --verify-tools --tools-as-warnings
                --pass-budget "$PASS_BUDGET_SECONDS"
                --shots keepalive-evidence)
          if [ -n "${{ steps.registry.outputs.sha }}" ]; then
            args+=(--expect-build "${{ steps.registry.outputs.sha }}"
                   --known-builds known-builds.txt)
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "${{ steps.registry.outputs.committed_at }}" ]; then
            args+=(--deployed-at "${{ steps.registry.outputs.committed_at }}"
                   --stale-grace-seconds "$STALE_GRACE_SECONDS")
          fi
          python3 scripts/keep_streamlit_awake.py "${args[@]}"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-evidence-${{ github.run_number }}
          path: |
            keepalive-evidence/
            keepalive-summary.json
          retention-days: 14
          if-no-files-found: ignore

  deploy-current:
    # A change to the deploy branch is the one moment to find out quickly
    # whether it went live. The schedule never runs this.
    #
    # The branch is spelled out rather than read from env because a job level
    # `if` cannot see env. tests/test_keep_streamlit_awake.py holds the two
    # spellings together.
    #
    # Not `needs: wake`. The two jobs run side by side; serialising them put
    # this verdict seven minutes later than it needed to be.
    if: >-
      github.event_name != 'schedule'
      && github.ref_name == 'claude/kind-feynman-489x72'
    runs-on: ubuntu-latest
    # Install, a first pass, the twenty minute window, and one last pass that
    # may start just inside the window: two bounded passes plus the wait.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Take the tool list from the deploy branch
        id: registry
        run: |
          git fetch --depth=1 origin "$DEPLOY_BRANCH"
          git show FETCH_HEAD:tools/registry.py > deployed-registry.py
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          echo "Measuring the live app against $DEPLOY_BRANCH at $(git rev-parse --short FETCH_HEAD)."

      - name: Wait for Community Cloud to apply the change, and report
        # Twenty minutes catches the prompt case, which today was under four
        # minutes, and gives up before the runner is wasted on the slow case,
        # which today ran to two hours and needs no help. Warning mode, so a
        # change still unapplied at the end is a warning on this run and a
        # pass, and an app that is down is a failure. The schedule carries
        # the warning from here and escalates only past the grace.
        run: |
          python3 scripts/keep_streamlit_awake.py \
            --apps .github/streamlit-apps.txt \
            --registry deployed-registry.py \
            --verify-tools --tools-as-warnings \
            --pass-budget "$PASS_BUDGET_SECONDS" \
            --expect-build "${{ steps.registry.outputs.sha }}" \
            --retry-until-current 1200 --retry-every 60 \
            --shots deploy-evidence

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence-${{ github.run_number }}
          path: |
            deploy-evidence/
            keepalive-summary.json
          retention-days: 14
          if-no-files-found: ignore
