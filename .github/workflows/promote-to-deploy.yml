# Promote a session branch onto the branch Streamlit Community Cloud serves.
#
# Community Cloud deploys one branch and one branch only. Work done on a
# session branch is invisible to every real visitor until it reaches that
# branch, so the gap between "committed" and "deployed" is where a finished
# tool quietly sits unseen. This closes the gap automatically, but only ever
# behind a green test run: an automatic merge that can ship a broken hub is
# worse than no automation at all, because it removes the person who would
# have noticed.
name: Promote session branch to the deploy branch

on:
  # Session branches only. The deploy branch and main are excluded again at
  # job level, because a branch filter alone would still let a push to the
  # deploy branch start a run that tried to merge that branch into itself.
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

# Two session branches landing at once would each check out the deploy branch,
# merge, and race to push. The loser's push either fails or lands on a ref that
# moved under it, which is how one of the two promotions quietly disappears.
# Serializing removes that race. It does not make the merged tree a tested
# tree: the gate below runs on the session branch, before the merge, so what
# is proved green is the branch and not the combination. The narrower claim is
# the true one, and the prober at the end is what looks at the merged result.
concurrency:
  # One queue per session branch, not one queue for the whole repository.
  # GitHub holds at most a single pending run per group, so a shared group
  # means a third push evicts whatever was waiting: branch A runs, branch B
  # queues, branch C arrives and B is cancelled. B's finished tool then never
  # reaches the deploy branch and the only trace is a grey cancelled run that
  # reads like housekeeping, which is the same end state this workflow exists
  # to prevent.
  #
  # Per branch queues let two promotions run at once, so the merge step below
  # re-fetches and retries rather than assuming it is alone. That is the right
  # place for the race to be handled: git already detects it exactly, by
  # rejecting a push that is not a fast forward.
  group: promote-to-deploy-${{ github.ref }}
  cancel-in-progress: false

# Writing to the repository is the whole job. Nothing else is needed, so
# nothing else is granted.
permissions:
  contents: write

env:
  # The branch Streamlit Community Cloud builds the live app from, recorded in
  # README.md and used by .github/workflows/keep-awake.yml as well.
  DEPLOY_BRANCH: claude/kind-feynman-489x72

# The suites that need a live hub and a real browser cannot run on a runner
# that has neither. scripts/run_suites.py knows which those are and reports
# them as skipped rather than as passed, and the keep awake job covers the live
# app for real, so no suite name needs listing here.

jobs:
  promote:
    runs-on: ubuntu-latest
    # The deploy branch matches "claude/**" too, so without this guard a push
    # to it would start a run that merged the deploy branch into itself. main
    # is named as well: it is not a session branch and is never promoted.
    # The literal branch name is repeated here on purpose, because the env
    # context is not available in a job level condition.
    if: >-
      github.ref_name != 'claude/kind-feynman-489x72' &&
      github.ref_name != 'main'
    # A cold Playwright install plus a full suite run is minutes, not hours.
    # An explicit ceiling stops a hung browser holding the concurrency group.
    timeout-minutes: 45

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # Shallow history cannot answer "is this branch already contained in
          # that one", which is the question the next step asks.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install what the suites import
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyyaml pytest

      - name: Decide whether there is anything to promote
        id: plan
        run: |
          set -euo pipefail
          SESSION_BRANCH="${GITHUB_REF_NAME}"
          SESSION_SHA="${GITHUB_SHA}"
          echo "session_branch=${SESSION_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "session_sha=${SESSION_SHA}" >> "$GITHUB_OUTPUT"

          if ! git fetch origin "+refs/heads/${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"; then
            echo "FAIL the deploy branch ${DEPLOY_BRANCH} does not exist on origin."
            exit 1
          fi

          if git merge-base --is-ancestor "${SESSION_SHA}" "origin/${DEPLOY_BRANCH}"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do: ${SESSION_BRANCH} at ${SESSION_SHA} is already"
            echo "contained in ${DEPLOY_BRANCH}. Exiting successfully without"
            echo "running the suites or touching the deploy branch."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "${SESSION_BRANCH} at ${SESSION_SHA} is not yet in ${DEPLOY_BRANCH}."
          fi

      - name: Run every suite the repository's own way
        id: gate
        if: steps.plan.outputs.needed == 'true'
        run: |
          set -uo pipefail
          # This step used to be a loop running `python3 tests/<file>.py` over
          # every suite, on the belief that all of them carry a __main__
          # runner. Most do not. A pytest style file run that way defines its
          # test functions, calls none of them, prints nothing and exits 0, so
          # the loop counted it as passed. Twenty eight of forty seven suites,
          # covering fourteen of the nineteen tools, were being waved through
          # without a single check executing, and this gate, the one thing
          # standing between a broken hub and the live app, reported "All
          # suites passed" while proving nothing about them.
          #
          # scripts/run_suites.py replaces that. It discovers the suites rather
          # than reading a list, runs each one the way its own style actually
          # executes, and fails any suite that cannot show that checks ran,
          # because exit 0 is not evidence.
          python3 scripts/run_suites.py --no-browser
          status=$?
          if [ "${status}" -ne 0 ]; then
            echo
            echo "FAIL the suites did not pass, so nothing is merged into ${DEPLOY_BRANCH}."
            exit "${status}"
          fi
          # The merge step requires this output to be exactly "true". An
          # implicit success() on a step condition would probably be enough,
          # but "probably" is not the right standard for the one gate that
          # stops a red branch reaching the live app, so the permission to
          # merge is written down explicitly and has to be read back.
          echo "green=true" >> "$GITHUB_OUTPUT"

      - name: Merge the session branch into the deploy branch and push
        id: merge
        # Both conditions are named. "needed" alone would let a red gate
        # through if the implicit success() ever stopped applying, and this is
        # the step that ships to the live app, so it states its own precondition.
        if: steps.plan.outputs.needed == 'true' && steps.gate.outputs.green == 'true'
        # Passed as environment variables rather than interpolated into the
        # script body. A git branch name may legally contain ; & | $ and
        # backticks, and a ${{ }} substitution would paste those straight into
        # the shell before it runs. As an env var the name is data, not code.
        env:
          SESSION_BRANCH: ${{ steps.plan.outputs.session_branch }}
          SESSION_SHA: ${{ steps.plan.outputs.session_sha }}
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only ever add to the deploy branch's history. The live app is
          # built from it, and rewriting history under a running deploy is how
          # a rollback becomes impossible to reason about later.
          #
          # Every git call below is checked. This script deliberately does not
          # use set -e, so that the conflict path can clean up before exiting,
          # and an unchecked command would therefore fail silently and let the
          # final echo report a success that never happened.
          #
          # The whole sequence retries, because the deploy branch can move
          # while this job runs. It used to fetch once at the start and push
          # once at the end, so a push that landed in between turned a
          # promotion that was green and safe into a red job waiting for a
          # human, and the finished tool sat merged nowhere until someone
          # noticed. A rejected push is not an error to report, it is a stale
          # base to refresh.
          attempts=3
          attempt=1
          while [ "${attempt}" -le "${attempts}" ]; do
            if ! git fetch origin "+refs/heads/${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"; then
              echo "FAIL could not fetch ${DEPLOY_BRANCH} from origin."
              exit 1
            fi

            if git merge-base --is-ancestor "${SESSION_SHA}" "origin/${DEPLOY_BRANCH}"; then
              echo "${SESSION_SHA} reached ${DEPLOY_BRANCH} while this job ran."
              echo "Another run promoted it. Nothing left to do."
              exit 0
            fi

            if ! git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"; then
              echo "FAIL could not check out ${DEPLOY_BRANCH} from origin."
              echo "Nothing was merged and nothing was pushed."
              exit 1
            fi

            if ! git merge --no-ff -m "Promote ${SESSION_BRANCH} to ${DEPLOY_BRANCH} after a green suite run" "${SESSION_SHA}"; then
              conflicts="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git merge --abort || true
              echo
              echo "FAIL the merge conflicts in: ${conflicts}"
              echo "The merge was aborted and nothing was pushed. A retry would"
              echo "conflict identically, so this needs a person: resolve those"
              echo "files on ${SESSION_BRANCH} and push again."
              exit 1
            fi

            if git push origin "${DEPLOY_BRANCH}"; then
              echo "Merged ${SESSION_BRANCH} into ${DEPLOY_BRANCH} and pushed."
              exit 0
            fi

            echo "Attempt ${attempt} of ${attempts}: the push was rejected, so"
            echo "${DEPLOY_BRANCH} moved while this job ran. Refreshing and"
            echo "merging again."
            attempt=$((attempt + 1))
          done

          echo
          echo "FAIL the push to ${DEPLOY_BRANCH} was rejected ${attempts} times."
          echo "The merge exists only in this runner and the live app is"
          echo "unchanged. A branch protection rule is the likely cause, since"
          echo "a moving branch would have been picked up by the refresh."
          echo "Nothing has been lost: rerun this job."
          exit 1

      - name: Fast forward main so the schedule keeps working
        # GitHub runs a schedule: trigger only from the copy of a workflow file
        # on the default branch. main is the default branch and did not carry
        # keep-awake.yml, so the every three hours wake had produced exactly
        # zero runs since it was written: the Actions API, filtered by
        # event=schedule, returned nothing at all. The app stayed awake only as
        # a side effect of somebody pushing.
        #
        # A one time merge would not have held, because nothing here ever
        # advanced main. So main is brought along on every promotion instead.
        # That also keeps the repository front page honest and means a session
        # branch cut from main starts with the current registry rather than
        # conflicting with it.
        #
        # Fast forward only. There is no --force anywhere: git rejects a push
        # that is not a fast forward, and a rejection here must be read and
        # reported rather than overridden, because main is the default branch
        # and somebody may have put something on it deliberately.
        if: steps.plan.outputs.needed == 'true' && steps.merge.outcome == 'success'
        run: |
          set -uo pipefail
          if git push origin "HEAD:main"; then
            echo "main now matches ${DEPLOY_BRANCH}, so the schedule runs the current workflow."
            exit 0
          fi
          echo "::error::main could not be fast forwarded to ${DEPLOY_BRANCH}. It has diverged, so nothing was forced. Until main carries keep-awake.yml the three hourly wake does not run at all. Reconcile main by hand."
          exit 1

      - name: Wake the live app and confirm the merge actually deployed
        # A push made with GITHUB_TOKEN does not trigger other workflows, so
        # keep-awake.yml will not fire for the push above. Without this the
        # newly merged tool would sit undeployed until something else happened
        # to wake the app.
        #
        # This step used to swallow its own result and stay green. That is
        # precisely how a tool sat on the deploy branch, merged and tested,
        # while the live app served an older build and nobody was told. The
        # merge cannot be undone from here and should not be, but a deploy
        # that never landed is a failure and now reads as one.
        if: steps.plan.outputs.needed == 'true' && steps.merge.outcome == 'success'
        run: |
          set -uo pipefail
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

          # Community Cloud rebuilds after the push above and that takes time,
          # so one look a second after the merge would report a stale deploy
          # that is merely a young one. Look repeatedly instead, and only call
          # it stale once it has had several minutes to catch up.
          for attempt in 1 2 3 4 5 6 7 8; do
            # The working tree is the deploy branch after the merge, so the
            # registry checked against the live app is the one just shipped.
            if python3 scripts/keep_streamlit_awake.py --verify-tools; then
              echo "The live app is awake and serving every registered tool."
              exit 0
            fi
            echo "Attempt ${attempt} of 8: the live app is not current yet."
            sleep 60
          done

          echo "::error::The merge to ${DEPLOY_BRANCH} succeeded, but the live app is still serving an older build after eight minutes of retries. Community Cloud has not rebuilt. Reboot the app from its Streamlit Community Cloud dashboard."
          exit 1

      - name: Say so when there was nothing to promote
        if: steps.plan.outputs.needed == 'false'
        run: |
          echo "${GITHUB_REF_NAME} is already contained in ${DEPLOY_BRANCH}."
          echo "No suites were run, no merge was made, and nothing was pushed."

  # A push made directly to the deploy branch never reaches the job above: it
  # is excluded there so a branch cannot be merged into itself. Without this
  # job main would still drift every time work landed on the deploy branch
  # without going through a session branch, which is how it fell 30 commits and
  # 17 tools behind in the first place.
  sync-main:
    runs-on: ubuntu-latest
    if: github.ref_name == 'claude/kind-feynman-489x72'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast forward main to the deploy branch
        run: |
          set -uo pipefail
          git fetch origin main || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 \
             && git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "main already contains ${GITHUB_SHA}. Nothing to do."
            exit 0
          fi
          if git push origin "${GITHUB_SHA}:main"; then
            echo "main fast forwarded to ${GITHUB_SHA}."
            exit 0
          fi
          echo "::error::main could not be fast forwarded to ${GITHUB_SHA}. It has diverged from the deploy branch, so nothing was forced. The three hourly keep awake schedule runs the copy of the workflow on main, so while main is behind, that schedule is running stale instructions or none at all."
          exit 1
